# ==============================================================================
# INFRASTRUCTURE BIG DATA YEEWU-SN
# ==============================================================================

networks:
  yeewu-net:
    driver: bridge

volumes:
  nifi_conf:
  hive-db:
  airflow-db:

services:
  # --------------------------------------------------------------------------
  # ZOOKEEPER
  # --------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: yeewu-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - yeewu-net

  # --------------------------------------------------------------------------
  # KAFKA
  # --------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: yeewu-kafka
    depends_on:
      - zookeeper
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://yeewu-kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - yeewu-net

  # --------------------------------------------------------------------------
  # POSTGRESQL (HIVE)
  # --------------------------------------------------------------------------
  postgres_hive:
    image: postgres:15-alpine
    container_name: yeewu-postgres-hive
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive_password
      POSTGRES_DB: metastore_db
    networks:
      - yeewu-net

  # --------------------------------------------------------------------------
  # POSTGRESQL (AIRFLOW)
  # --------------------------------------------------------------------------
  postgres_airflow:
    image: postgres:15-alpine
    container_name: yeewu-postgres-airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    networks:
      - yeewu-net

  # --------------------------------------------------------------------------
  # HBASE
  # --------------------------------------------------------------------------
  hbase:
    image: dajobe/hbase:latest
    container_name: yeewu-hbase
    ports:
      - "16010:16010"
      - "9090:9090"
    command: >
      bash -c "
      /opt/hbase/bin/start-hbase.sh && 
      /opt/hbase/bin/hbase-daemon.sh start thrift && 
      tail -f /dev/null
      "
    networks:
      - yeewu-net

  # --------------------------------------------------------------------------
  # HIVE METASTORE
  # --------------------------------------------------------------------------
  hive-metastore:
    image: apache/hive:4.1.0
    container_name: yeewu-hive-metastore
    depends_on:
      - postgres_hive
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres_hive:5432/metastore_db
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive_password
        -Dhive.metastore.warehouse.dir=/tmp/hive/warehouse
    ports:
      - "9083:9083"
    networks:
      - yeewu-net

  # --------------------------------------------------------------------------
  # HIVE SERVER2
  # --------------------------------------------------------------------------
  hive-server2:
    image: apache/hive:4.1.0
    container_name: yeewu-hive-server2
    depends_on:
      - hive-metastore
    environment:
      SERVICE_NAME: hiveserver2
      SERVICE_OPTS: >-
        -Dhive.metastore.uris=thrift://yeewu-hive-metastore:9083
        -Dhive.metastore.warehouse.dir=/tmp/hive/warehouse
      IS_RESUME: "true"
    ports:
      - "10000:10000"
      - "10002:10002"
    networks:
      - yeewu-net

  # --------------------------------------------------------------------------
  # NIFI
  # --------------------------------------------------------------------------
  nifi:
    image: apache/nifi:latest
    container_name: yeewu-nifi
    ports:
      - "8081:8081"
      - "8443:8443"
    environment:
      - NIFI_WEB_HTTP_PORT=8081
      - NIFI_WEB_HTTPS_PORT=8443
      - SINGLE_USER_CREDENTIALS_USERNAME=admin
      - SINGLE_USER_CREDENTIALS_PASSWORD=MotDePasseComplexe123!
    volumes:
      - nifi_conf:/opt/nifi/nifi-current/conf
    depends_on:
      - kafka
    networks:
      - yeewu-net

  # --------------------------------------------------------------------------
  # AIRFLOW (INIT)
  # --------------------------------------------------------------------------
  airflow-init:
    image: apache/airflow:2.8.1-python3.11
    container_name: yeewu-airflow-init
    depends_on:
      - postgres_airflow
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres_airflow:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    command: version
    networks:
      - yeewu-net

  # --------------------------------------------------------------------------
  # AIRFLOW (WEBSERVER)
  # --------------------------------------------------------------------------
  airflow-webserver:
    image: apache/airflow:2.8.1-python3.11
    container_name: yeewu-airflow-webserver
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres_airflow:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__WEBSERVER__SECRET_KEY: 'yeewu-secret-key'
      AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: 300
    volumes:
      
      - C:/Projets_M2/uadb-m2-yeewu-sn/dags:/opt/airflow/dags
      - C:/Projets_M2/uadb-m2-yeewu-sn/scripts:/opt/airflow/scripts
      - C:/Projets_M2/uadb-m2-yeewu-sn/data:/opt/airflow/data
      - C:/Projets_M2/uadb-m2-yeewu-sn/models:/opt/airflow/models
    ports:
      - "8080:8080"
    command: webserver
    networks:
      - yeewu-net

  # --------------------------------------------------------------------------
  # AIRFLOW (SCHEDULER)
  # --------------------------------------------------------------------------
  airflow-scheduler:
    image: apache/airflow:2.8.1-python3.11
    container_name: yeewu-airflow-scheduler
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres_airflow:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    volumes:
      
      - C:/Projets_M2/uadb-m2-yeewu-sn/dags:/opt/airflow/dags
      - C:/Projets_M2/uadb-m2-yeewu-sn/scripts:/opt/airflow/scripts
      - C:/Projets_M2/uadb-m2-yeewu-sn/data:/opt/airflow/data
      - C:/Projets_M2/uadb-m2-yeewu-sn/models:/opt/airflow/models
    command: scheduler
    networks:
      - yeewu-net